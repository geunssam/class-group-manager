<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>모둠 뽑기 - Class Group Manager</title>

    <!-- PWA 메타태그 -->
    <meta name="description" content="학급 모둠을 쉽고 재미있게 구성하는 앱">
    <meta name="theme-color" content="#3b82f6">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">

    <!-- iOS Safari PWA 최적화 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="모둠 뽑기">
    <meta name="format-detection" content="telephone=no">

    <!-- 아이콘 -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon.svg">

    <!-- iOS 스플래시 스크린 (기본 색상) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- 스타일시트 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">

    <!-- iOS 스플래시 스크린 스타일 -->
    <style>
        /* iOS PWA 스플래시 배경 */
        html {
            background-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" class="container mx-auto px-3 py-3 max-w-6xl">

        <!-- 헤더 섹션 -->
        <header class="bg-white rounded-xl shadow-sm p-3 mb-2">
            <div class="flex items-center justify-between">
                <h1 class="text-lg font-bold text-blue-600">🎲 두근두근 모둠뽑기</h1>
                <div class="flex items-center gap-2">
                    <select id="classSelect" class="px-2 py-1 border border-gray-300 rounded-lg bg-white text-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">학급 선택</option>
                    </select>
                    <button id="btnEditClass" class="px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-600 text-sm">
                        편집
                    </button>
                    <button id="btnSettings" class="p-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg text-gray-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- 타이머 섹션 -->
        <section class="bg-white rounded-xl shadow-sm p-3 mb-2">
            <!-- 상단: 타이머 모드 탭 + 프리셋 버튼 -->
            <div class="flex items-center justify-between mb-2">
                <div class="flex bg-gray-100 rounded-lg p-0.5">
                    <button id="tabGlobalTimer" class="px-3 py-1 text-xs font-medium rounded-md bg-white text-blue-600 shadow-sm transition">전체</button>
                    <button id="tabPerGroupTimer" class="px-3 py-1 text-xs font-medium rounded-md text-gray-500 hover:text-gray-700 transition">모둠별</button>
                </div>
                <div class="flex items-center gap-1">
                    <button class="timer-preset px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded text-xs font-medium" data-time="60">1분</button>
                    <button class="timer-preset px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded text-xs font-medium" data-time="180">3분</button>
                    <button class="timer-preset px-2 py-1 bg-blue-100 text-blue-600 rounded text-xs font-medium" data-time="300">5분</button>
                </div>
            </div>
            <!-- 하단: 타이머 숫자 + 컨트롤 버튼 -->
            <div id="globalTimerSection" class="flex items-center justify-center gap-4">
                <div class="text-4xl font-mono font-bold text-gray-800 tracking-wider" id="timerDisplay">05:00</div>
                <div class="flex items-center gap-1">
                    <button id="btnTimerStart" class="px-3 py-1.5 bg-green-500 hover:bg-green-600 text-white font-bold rounded-lg text-sm">▶ 시작</button>
                    <button id="btnTimerPause" class="px-3 py-1.5 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-lg text-sm hidden">⏸ 정지</button>
                    <button id="btnTimerReset" class="px-3 py-1.5 bg-gray-400 hover:bg-gray-500 text-white font-bold rounded-lg text-sm">↺ 리셋</button>
                </div>
            </div>
            <div id="perGroupTimerSection" class="hidden flex items-center justify-center gap-4">
                <span class="text-gray-500 text-sm">각 모둠 카드에서 개별 타이머 조작</span>
                <div class="flex items-center gap-1">
                    <button id="btnStartAllTimers" class="px-3 py-1.5 bg-green-500 hover:bg-green-600 text-white font-bold rounded-lg text-sm">▶ 전체시작</button>
                    <button id="btnResetAllTimers" class="px-3 py-1.5 bg-gray-400 hover:bg-gray-500 text-white font-bold rounded-lg text-sm">↺ 전체리셋</button>
                </div>
            </div>
            <!-- 숨겨진 요소 (기존 기능 유지) -->
            <select id="timerMode" class="hidden"><option value="global">전체</option><option value="perGroup">모둠별</option></select>
            <input type="number" id="customTime" class="hidden" min="10" max="3600">
        </section>

        <!-- 모둠 뽑기 섹션 -->
        <section class="bg-white rounded-xl shadow-sm p-3 mb-3">
            <div class="flex items-center justify-center gap-2 flex-wrap">
                <div class="flex items-center gap-1">
                    <button id="btnGroupSizeMinus" class="w-6 h-6 bg-blue-50 hover:bg-blue-100 rounded text-blue-500 font-bold text-sm">−</button>
                    <input type="number" id="groupSize" value="4" min="2" max="10"
                           class="w-10 px-1 py-1 border border-gray-300 rounded text-center text-lg font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="btnGroupSizePlus" class="w-6 h-6 bg-blue-50 hover:bg-blue-100 rounded text-blue-500 font-bold text-sm">+</button>
                    <span class="text-gray-600 text-sm">명씩</span>
                </div>
                <div class="flex items-center gap-1">
                    <button id="btnGroupCountMinus" class="w-6 h-6 bg-blue-50 hover:bg-blue-100 rounded text-blue-500 font-bold text-sm">−</button>
                    <input type="number" id="groupCount" value="6" min="1" max="15"
                           class="w-10 px-1 py-1 border border-gray-300 rounded text-center text-lg font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="btnGroupCountPlus" class="w-6 h-6 bg-blue-50 hover:bg-blue-100 rounded text-blue-500 font-bold text-sm">+</button>
                    <span class="text-gray-600 text-sm">모둠</span>
                </div>
                <button id="btnPick" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition text-sm">
                    🎲 뽑기!
                </button>
                <button id="btnReset" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-600 font-medium rounded-lg transition text-sm">
                    ↺ 초기화
                </button>
            </div>
        </section>

        <!-- 모둠 카드들 -->
        <section id="groupsContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
            <!-- 모둠 카드가 여기에 동적으로 생성됨 -->
        </section>
    </div>

    <!-- 학급 편집 모달 -->
    <div id="classModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 max-h-[90vh] overflow-hidden">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold text-gray-800">학급 명단 편집</h2>
                    <button id="btnCloseModal" class="p-2 hover:bg-gray-100 rounded-lg transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="p-6 overflow-y-auto max-h-[60vh]">
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">학급 이름</label>
                    <div class="flex gap-2">
                        <input type="text" id="className" placeholder="예: 6학년 3반"
                               class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button id="btnAddClass" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">
                            추가
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">저장된 학급</label>
                    <div id="classList" class="space-y-2">
                        <!-- 학급 목록이 여기에 표시됨 -->
                    </div>
                </div>
                <div class="mb-4">
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-gray-700 font-medium">학생 명단 (한 줄에 한 명)</label>
                        <div class="flex gap-2">
                            <label class="px-3 py-1 bg-green-100 hover:bg-green-200 text-green-700 rounded-lg text-sm cursor-pointer transition">
                                📁 CSV 가져오기
                                <input type="file" id="csvFileInput" accept=".csv,.txt" class="hidden">
                            </label>
                        </div>
                    </div>
                    <textarea id="studentList" rows="10" placeholder="김철수&#10;이영희&#10;박지민&#10;..."
                              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono"></textarea>
                    <p class="text-xs text-gray-500 mt-1">💡 CSV/TXT 파일에서 이름만 추출됩니다 (첫 번째 열 또는 '이름' 열)</p>
                </div>
            </div>
            <div class="p-6 border-t border-gray-200 bg-gray-50">
                <div class="flex justify-end gap-3">
                    <button id="btnDeleteClass" class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg transition">
                        학급 삭제
                    </button>
                    <button id="btnSaveClass" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">
                        저장
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 남는 학생 처리 모달 -->
    <div id="remainingModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4">
            <div class="p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">남는 학생이 있어요!</h2>
                <p id="remainingInfo" class="text-gray-600 mb-6"></p>
                <div class="space-y-3">
                    <button id="btnDistribute" class="w-full px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition">
                        기존 모둠에 분배하기
                    </button>
                    <button id="btnSeparate" class="w-full px-4 py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl transition">
                        별도 모둠으로 만들기
                    </button>
                    <button id="btnCancelPick" class="w-full px-4 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl transition">
                        취소
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 max-h-[90vh] overflow-hidden">
            <div class="p-4 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-gray-800">⚙️ 설정</h2>
                    <button id="btnCloseSettings" class="p-2 hover:bg-gray-100 rounded-lg transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="p-4 space-y-4 overflow-y-auto max-h-[70vh]">
                <!-- 쿠키 모드 설정 -->
                <div>
                    <label class="block text-gray-700 font-medium mb-3">🍪 칭찬 쿠키 모드</label>
                    <div class="space-y-2">
                        <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                            <input type="radio" name="cookieMode" value="session" class="w-4 h-4 text-blue-600">
                            <div>
                                <span class="font-medium">일회성 모드</span>
                                <p class="text-sm text-gray-500">현재 수업에서만 사용, 새로 뽑으면 초기화</p>
                            </div>
                        </label>
                        <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                            <input type="radio" name="cookieMode" value="cumulative" class="w-4 h-4 text-blue-600">
                            <div>
                                <span class="font-medium">누적 모드</span>
                                <p class="text-sm text-gray-500">학급별 쿠키 히스토리 저장, 통계 확인 가능</p>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 타이머 알림 설정 -->
                <div>
                    <label class="block text-gray-700 font-medium mb-3">🔔 타이머 알림</label>
                    <div class="space-y-2">
                        <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                            <input type="radio" name="timerAlert" value="soundAndVisual" class="w-4 h-4 text-blue-600">
                            <span>소리 + 화면</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                            <input type="radio" name="timerAlert" value="visualOnly" class="w-4 h-4 text-blue-600">
                            <span>화면만</span>
                        </label>
                    </div>
                </div>

                <!-- 뽑기 애니메이션 설정 -->
                <div>
                    <label class="block text-gray-700 font-medium mb-3">🎬 뽑기 애니메이션</label>
                    <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" id="animationEnabled" class="w-4 h-4 text-blue-600 rounded">
                        <div>
                            <span class="font-medium">애니메이션 사용</span>
                            <p class="text-sm text-gray-500">모둠 뽑기 시 슬롯머신 효과</p>
                        </div>
                    </label>
                </div>

                <!-- 쿠키 통계 버튼 -->
                <div class="pt-4 border-t border-gray-200">
                    <button id="btnShowStats" class="w-full px-4 py-3 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-xl transition flex items-center justify-center gap-2">
                        <span>📊</span>
                        <span>쿠키 통계 보기</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 쿠키 통계 모달 -->
    <div id="statsModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 max-h-[90vh] overflow-hidden">
            <div class="p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold text-gray-800">📊 쿠키 통계</h2>
                    <button id="btnCloseStats" class="p-2 hover:bg-gray-100 rounded-lg transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="p-6 overflow-y-auto max-h-[60vh]">
                <div id="statsContent">
                    <!-- 통계 내용이 여기에 표시됨 -->
                </div>
            </div>
            <div class="p-6 border-t border-gray-200 bg-gray-50">
                <div class="flex justify-between gap-3">
                    <button id="btnSaveCookies" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition">
                        현재 기록 저장
                    </button>
                    <button id="btnClearStats" class="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg transition">
                        히스토리 초기화
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 뽑기 애니메이션 오버레이 -->
    <div id="pickingOverlay" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-40 hidden">
        <div class="text-center">
            <div id="pickingEmoji" class="text-8xl mb-4 picking-text">🎲</div>
            <p id="pickingMessage" class="text-white text-2xl font-bold">모둠을 구성하고 있어요...</p>
        </div>
    </div>

    <!-- 토스트 메시지 -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 px-6 py-3 bg-gray-800 text-white rounded-xl shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none">
        <span id="toastMessage"></span>
    </div>

    <!-- iOS PWA 설치 안내 배너 -->
    <div id="iosInstallBanner" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-lg z-50 hidden safe-area-bottom">
        <div class="flex items-center justify-between max-w-lg mx-auto">
            <div class="flex items-center gap-3">
                <img src="icons/icon.svg" alt="앱 아이콘" class="w-12 h-12 rounded-xl">
                <div>
                    <p class="font-bold text-gray-800">홈 화면에 추가</p>
                    <p class="text-sm text-gray-500">더 빠르게 사용하세요</p>
                </div>
            </div>
            <button id="iosInstallClose" class="p-2 hover:bg-gray-100 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="mt-3 text-center text-sm text-gray-600 max-w-lg mx-auto">
            <span class="inline-flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                공유
            </span>
            버튼 →
            <span class="font-medium">"홈 화면에 추가"</span>
            를 탭하세요
        </div>
    </div>

    <script src="js/store.js"></script>
    <script src="js/app.js"></script>

    <!-- PWA 및 Service Worker 등록 -->
    <script>
        // Service Worker 등록
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('./sw.js');
                    console.log('Service Worker 등록 성공:', registration.scope);
                } catch (error) {
                    console.log('Service Worker 등록 실패:', error);
                }
            });
        }

        // iOS PWA 설치 안내
        (function() {
            // iOS Safari 감지
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const isInStandaloneMode = window.matchMedia('(display-mode: standalone)').matches ||
                                       window.navigator.standalone === true;

            // iOS Safari에서 standalone 모드가 아닐 때만 배너 표시
            if (isIOS && !isInStandaloneMode) {
                const banner = document.getElementById('iosInstallBanner');
                const closeBtn = document.getElementById('iosInstallClose');

                // 이전에 닫았는지 확인
                const dismissed = localStorage.getItem('iosInstallDismissed');
                const dismissedTime = dismissed ? parseInt(dismissed) : 0;
                const oneDayAgo = Date.now() - (24 * 60 * 60 * 1000);

                // 24시간 이내에 닫지 않았으면 표시
                if (dismissedTime < oneDayAgo) {
                    setTimeout(() => {
                        banner.classList.remove('hidden');
                    }, 3000);
                }

                closeBtn.addEventListener('click', () => {
                    banner.classList.add('hidden');
                    localStorage.setItem('iosInstallDismissed', Date.now().toString());
                });
            }

            // Android/Chrome 설치 프롬프트 처리
            let deferredPrompt;
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                // 필요시 설치 버튼 표시 가능
            });
        })();

        // iOS standalone 모드에서 링크 처리 (새 탭 방지)
        if (window.navigator.standalone) {
            document.addEventListener('click', (e) => {
                const target = e.target.closest('a');
                if (target && target.href && target.href.indexOf(location.host) !== -1) {
                    e.preventDefault();
                    location.href = target.href;
                }
            });
        }
    </script>
</body>
</html>
