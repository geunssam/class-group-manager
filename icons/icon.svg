<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)"/>

  <!-- Dice -->
  <g transform="translate(130, 110)">
    <!-- Dice body -->
    <rect x="0" y="0" width="250" height="250" rx="30" ry="30" fill="url(#diceGrad)" stroke="#d1d5db" stroke-width="3"/>

    <!-- Dice dots (showing 6) -->
    <!-- Left column -->
    <circle cx="60" cy="60" r="22" fill="#1f2937"/>
    <circle cx="60" cy="125" r="22" fill="#1f2937"/>
    <circle cx="60" cy="190" r="22" fill="#1f2937"/>

    <!-- Right column -->
    <circle cx="190" cy="60" r="22" fill="#1f2937"/>
    <circle cx="190" cy="125" r="22" fill="#1f2937"/>
    <circle cx="190" cy="190" r="22" fill="#1f2937"/>
  </g>

  <!-- Group of people icons at bottom -->
  <g transform="translate(106, 380)">
    <!-- Person 1 -->
    <circle cx="50" cy="30" r="25" fill="#fbbf24"/>
    <path d="M25,90 Q25,60 50,60 Q75,60 75,90" fill="#fbbf24"/>

    <!-- Person 2 -->
    <circle cx="150" cy="30" r="25" fill="#34d399"/>
    <path d="M125,90 Q125,60 150,60 Q175,60 175,90" fill="#34d399"/>

    <!-- Person 3 -->
    <circle cx="250" cy="30" r="25" fill="#f87171"/>
    <path d="M225,90 Q225,60 250,60 Q275,60 275,90" fill="#f87171"/>
  </g>
</svg>
